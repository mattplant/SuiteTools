# SuiteTools CI — install → typecheck → lint → test → build, plus dependency and
# security hygiene gates (dedupe, audit, SAST, secret detection). The test job also
# measures coverage and publishes it to the merge request diff (#111).
# SuiteCloud deploy is intentionally out of scope for MR/default-branch CI.
# Node matches .node-version; Yarn matches packageManager / .yarn/releases.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Free tier: both templates run and publish JSON report artifacts, but the MR
# security widget, the vulnerability report and the security dashboard are all
# Ultimate — read findings from the job log or the artifact until that changes.
# Of the SAST analyzers only semgrep-sast is reachable here: the rest are gated
# on $GITLAB_FEATURES containing sast_advanced (Ultimate), on languages this repo
# does not contain (Apex, Elixir, Groovy, C/C++), or are deprecated stubs.
# Both scanners already ship allow_failure: true in the templates.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

default:
  image: node:24-bookworm
  interruptible: true

variables:
  # Keep the Yarn cache under the project dir (matches enableGlobalCache: false in
  # .yarnrc.yml) so the cache: key below actually hits between pipelines.
  YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/.yarn/cache"
  YARN_ENABLE_GLOBAL_CACHE: "false"
  # Required for @oracle/suitecloud-cli postinstall (reads npm_config_*).
  # Setting this accepts Oracle Free Use Terms and Conditions for the SuiteCloud SDK JAR download.
  # See: https://www.oracle.com/downloads/licenses/oracle-free-license.html
  npm_config_acceptsuitecloudsdklicense: "true"
  # The security scanners default to running in *branch* pipelines only. The
  # workflow: rules above never create a branch pipeline for a feature branch,
  # so without this the scanners would only ever run post-merge on main — which
  # is exactly when their findings are least useful. (GitLab 18.0+)
  AST_ENABLE_MR_PIPELINES: "true"

cache:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/cache

stages:
  - validate

.validate:
  stage: validate
  before_script:
    - node --version
    # No pinned version here: `packageManager` in package.json and `yarnPath` in
    # .yarnrc.yml are the single source of truth. Pinning a second copy here went
    # stale when #73 moved 4.9.2 -> 4.18.0.
    - corepack enable
    - yarn --version
    - yarn install --immutable
  # "Pipelines must succeed" is enabled in GitLab → Settings → Merge requests,
  # with "allow merge on skipped pipeline" off, so a red job here blocks merge.

typecheck:
  extends: .validate
  script:
    - yarn typecheck

lint:
  extends: .validate
  script:
    - yarn lint

# Runs the suite with coverage instrumentation rather than plain `yarn test`. Same
# pass/fail signal, one run instead of two: a separate coverage job would double the
# slowest stage in the pipeline for no extra merge-blocking information.
#
# #111 turned the number on and deliberately set no threshold. There is nothing here that
# reds the job on a low figure -- only on a failing test -- because a gate written against
# an unmeasured baseline either fails on day one or is pitched so low it certifies nothing.
# Baseline at the time of writing: 16.37% of lines (571/3488).
test:
  extends: .validate
  script:
    - yarn test:coverage
  # `scripts/coverage-summary.mjs` prints this after the three per-workspace tables. Without
  # it GitLab would scrape whichever workspace table happened to print last and label one
  # workspace as the whole repository.
  coverage: '/^Total coverage: (\d+\.\d+)%/'
  artifacts:
    # A red suite still leaves a readable report (`reportOnFailure` in both Vitest configs).
    when: always
    expire_in: 1 week
    paths:
      # The HTML reports -- the only per-line view without rerunning locally.
      - "*/coverage/"
    reports:
      # One report per workspace, merged by GitLab, which is what puts per-line coverage on
      # the MR diff. Each file's <sources> is $CI_PROJECT_DIR/<workspace>, which matches the
      # <CI_BUILDS_DIR>/<PROJECT_FULL_PATH>/... shape GitLab requires to rewrite the
      # workspace-relative filenames to repository-relative ones. Run the jobs from anywhere
      # else and the annotations silently stop appearing.
      coverage_report:
        coverage_format: cobertura
        path: "*/coverage/cobertura-coverage.xml"

# Builds every workspace. `yarn build:all` was the only root script CI never ran,
# which is how #79's broken clean-checkout build reached main unnoticed: the
# frontend/backend `prebuild` hooks that were meant to build `shared` first never
# fired, because Yarn Berry does not run implicit pre/post scripts.
build:
  extends: .validate
  script:
    - yarn build:all

# Lockfile hygiene. The Build & Release Checklist used to ask contributors to run
# this by hand on dependency MRs; enforcing locally did not hold. #113 committed a
# `yarn dedupe` pass first (55 packages collapsed, 21 removed, -6.77 MiB) so this
# job starts green and merge-blocking.
dedupe:
  extends: .validate
  script:
    - yarn dedupe --check

# `--all` audits every workspace, not just the root one. Root-only scope is what
# made this look clean when #113 first measured it; across all four workspaces
# there is a real backlog — 1 critical / 29 high / 12 moderate at time of writing,
# every one of them in dev and build tooling (node-gyp's tar, jest's
# minimatch/glob, babel, rollup, sucrase), with flowbite-react the only shipped
# runtime dependent.
#
# Non-blocking on purpose, for two reasons: that backlog predates this job and
# cannot be cleared by the MR that adds it, and a freshly published CVE in a
# transitive dep should not red an unrelated MR. Tighten to blocking once the
# backlog is worked down.
audit:
  extends: .validate
  script:
    - yarn npm audit --all --recursive --severity moderate
  allow_failure: true

# The security templates place their jobs in a `test` stage this project does not
# define. Move them into `validate` rather than adding a stage: jobs in one stage
# run in parallel, so a leaked secret still surfaces on an MR whose lint is red.
# (Overriding the `sast` config job reaches every analyzer through `extends`.)
# cache: [] opts them out of the top-level Yarn cache, which they have no use for.
sast:
  stage: validate
  cache: []

secret_detection:
  stage: validate
  cache: []
