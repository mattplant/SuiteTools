# Settings written by Yarn's 4.18.0 migration (YN0087) to preserve the behaviour
# this project had under 4.9.2. Yarn 4.18 hardened three defaults; each pin below
# records the new default so the choice stays a deliberate one.

# 4.18 default: []. No dependency in yarn.lock resolves over git, so this is
# broader than needed and is a candidate for tightening.
approvedGitRepositories:
  - "**"

# Keep the Yarn cache inside the repo. Under PnP this existed so .pnp.cjs paths
# stayed portable across clone depths; that rationale is gone, but a project-local
# cache still keeps CI cache keys and offline installs predictable.
enableGlobalCache: false

# 4.18 default: false. Must stay true here — esbuild, rolldown, rollup,
# oxc-parser, lightningcss and @oracle/suitecloud-cli all rely on install
# scripts to place their native binaries.
enableScripts: true

nodeLinker: node-modules

# 4.18 default: 1d — a supply-chain guard that refuses package versions
# published within the last day. Pinned to 0 by the migration, which opts out
# of that protection.
npmMinimalAgeGate: 0

# The SuiteCloud Jest transformer loads Babel presets without declaring @babel/core.
# Re-checked under node-modules in #74 and kept: removing it leaves @babel/core an
# unmet peer of @babel/preset-env and 88 other packages. The ts-jest -> jest-util
# extension was measured the same way, changed nothing, and was removed.
packageExtensions:
  "@oracle/suitecloud-unit-testing@*":
    dependencies:
      "@babel/core": "*"

plugins:
  - checksum: ffd9b2dbbe2efe008987559cb4cfb8feeee45eae9b550bbd6154a535919362466f4a09a9de56f1e1502a804592b95848839bc9c5bdd7d4e2891d8532e7045258
    path: .yarn/plugins/@yarnpkg/plugin-licenses.cjs
    spec: "https://raw.githubusercontent.com/mhassan1/yarn-plugin-licenses/v0.15.1/bundles/@yarnpkg/plugin-licenses.js"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
